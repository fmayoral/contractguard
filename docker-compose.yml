# Containerised demo: `docker compose up --build`, then open http://localhost:5173.
# The demo repository is materialised inside the backend container on startup;
# state (runs, artifacts, Maven cache) persists in named volumes. Every
# environment value below is optional and read from a .env file next to this
# one (see .env.example) -- the demo works with none of them set. Full
# walkthrough: docs/deployment.md.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "127.0.0.1:16686:16686"   # trace viewer UI

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Host-side port only -- the container still listens on 7080 internally
      # (nginx's proxy and the healthcheck below both talk to it in-network),
      # so only this left-hand number needs to dodge a taken/reserved host port.
      - "127.0.0.1:7900:7080"
    environment:
      CONTRACTGUARD_DEMO_CONTENT: ${CONTRACTGUARD_DEMO_CONTENT:-true}
      CONTRACTGUARD_LLM_PROVIDER: ${CONTRACTGUARD_LLM_PROVIDER:-mock}
      CONTRACTGUARD_LLM_API_KEY: ${CONTRACTGUARD_LLM_API_KEY:-}
      CONTRACTGUARD_LLM_BASE_URL: ${CONTRACTGUARD_LLM_BASE_URL:-https://api.openai.com/v1}
      CONTRACTGUARD_LLM_MODEL: ${CONTRACTGUARD_LLM_MODEL:-gpt-4o-mini}
      CONTRACTGUARD_CREDENTIAL_KEY: ${CONTRACTGUARD_CREDENTIAL_KEY:-}
      CONTRACTGUARD_AUDIT_PRINCIPAL: ${CONTRACTGUARD_AUDIT_PRINCIPAL:-local-operator}
      # Extra frontend origins allowed to call the API cross-origin, on top of
      # the always-allowed localhost/127.0.0.1 -- needed to reach the dashboard
      # from another device on the LAN (see .env.example).
      CONTRACTGUARD_CORS_EXTRA_ORIGINS: ${CONTRACTGUARD_CORS_EXTRA_ORIGINS:-}
      # Bundled Jaeger is the default trace viewer for this compose setup;
      # point elsewhere (or unset to fall back to log-only export) via .env.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://jaeger:4318/v1/traces}
      # Outbound webhook fired when a run needs approval or finishes (FR-031);
      # unset disables it entirely. dashboard-url adds a clickable link to the
      # payload -- e.g. http://localhost:5173 for this compose setup.
      CONTRACTGUARD_NOTIFICATIONS_WEBHOOK_URL: ${CONTRACTGUARD_NOTIFICATIONS_WEBHOOK_URL:-}
      CONTRACTGUARD_NOTIFICATIONS_DASHBOARD_URL: ${CONTRACTGUARD_NOTIFICATIONS_DASHBOARD_URL:-}
    depends_on:
      - jaeger
    volumes:
      - contractguard-data:/app/data
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Bound to all interfaces (not 127.0.0.1) so other devices on the LAN
      # can reach the demo; /api/ is proxied to the backend in-network (see
      # nginx.conf), so the backend/Jaeger ports don't need to be exposed too.
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # Opt-in code-quality server (docs/deployment.md §7) -- excluded from a
  # plain `docker compose up` so the everyday demo stays fast and light;
  # start it explicitly with `docker compose --profile quality up -d sonarqube`.
  # Embedded H2 storage (SonarQube's own default): fine for this single-user,
  # local dev-tool role, matching the same trade-off this compose file already
  # makes for the app's own database (see §6, "What's intentionally not wired in").
  sonarqube:
    image: sonarqube:lts-community
    profiles: ["quality"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # SonarQube's embedded Elasticsearch normally refuses to start unless the
      # host raises vm.max_map_count/ulimits -- not reliably settable from a
      # non-privileged container on every Docker Desktop setup. This is
      # SonarSource's own documented dev-mode escape hatch (never for
      # production); if analysis feels slow, raising the host's
      # vm.max_map_count instead is the real fix (§7 troubleshooting).
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      # The image ships wget, not curl (unlike the backend's own healthcheck above).
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  contractguard-data:
  maven-cache:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
