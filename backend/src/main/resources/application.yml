server:
  # Local-first: bind to loopback only by default. 7080 rather than 8080
  # because desktop software (e.g. NVIDIA Broadcast) squats on 8080, and
  # Windows Hyper-V/WinNAT port-exclusion ranges often swallow 8081-9231.
  address: 127.0.0.1
  port: 7080

management:
  # Observability (FR-029, ADR-0011): Prometheus scrape target, health/readiness probes for
  # orchestration, and full-sampling OpenTelemetry tracing (Micrometer Observation), acceptable
  # at this tool's single-operator scale. No OTLP endpoint is configured by default, so spans are
  # exported to the log only; set management.otlp.tracing.endpoint to point at a real collector.
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: contractguard
  servlet:
    multipart:
      # Bounds uploaded specification files (FR-043, ADR-0012); an OpenAPI document is normally
      # well under this.
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: jdbc:h2:file:./../data/contractguard;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    # Vendor-specific DDL: db/migration/h2 locally, db/migration/postgresql
    # when the postgres profile is active.
    locations: classpath:db/migration/{vendor}
    # Adopt databases created before Flyway managed the schema.
    baseline-on-migrate: true

contractguard:
  # Repositories must live directly under one of these roots.
  workspace:
    roots:
      - ../workspace
  storage:
    # Embedded database and run artifacts live here.
    directory: ../data
    # Days to keep finished runs (events and artifacts included); 0 disables.
    retention-days: 0
  specs:
    # Directory the run setup offers OpenAPI specifications from.
    directory: ../samples/openapi
  llm:
    # mock = deterministic scripted gateway (no network, no key).
    # openai = OpenAI-compatible endpoint configured below.
    provider: mock
    base-url: ${CONTRACTGUARD_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${CONTRACTGUARD_LLM_API_KEY:}
    model: ${CONTRACTGUARD_LLM_MODEL:gpt-4o-mini}
    timeout: 60s
    max-tokens: 4096
    temperature: 0.0
    max-workflow-steps: 20
  validation:
    command-key: maven-verify
    timeout: 15m
    max-output-bytes: 1000000
    docker:
      # Sandboxed build validation (FR-030): the consumer's own build runs on
      # the host by default. Set to true to run it in a resource-limited,
      # network-isolated container instead (requires a local Docker daemon).
      enabled: ${CONTRACTGUARD_VALIDATION_DOCKER_ENABLED:false}
      image: eclipse-temurin:21-jdk
      memory: 2g
      cpus: "2"
      # No network egress by default (see ADR-0010); maven-local-repo below is
      # bind-mounted read-only instead, so already-resolved dependencies and
      # the Maven wrapper's cached distribution still work offline.
      network-enabled: false
      maven-local-repo: ${CONTRACTGUARD_DOCKER_M2:${user.home}/.m2}
  remote:
    # Encrypts remote-repository credentials at rest (FR-027); required only
    # to register a remote repository, not for purely local workspace use.
    credential-key: ${CONTRACTGUARD_CREDENTIAL_KEY:}
  audit:
    # Attributed to every audit entry until FR-024 adds real authenticated
    # principals; not a security boundary, just the compliance record's
    # "who" field for this single-operator tool.
    default-principal: ${CONTRACTGUARD_AUDIT_PRINCIPAL:local-operator}
  concurrency:
    # Bounds the system-wide run queue (FR-032); creation is rejected with a
    # 503 once this many runs are simultaneously non-terminal.
    max-active-runs: 10
  cors:
    # Extra frontend origins allowed to call the API cross-origin (comma-separated),
    # on top of the always-allowed http://localhost:5173 and http://127.0.0.1:5173.
    # Add e.g. http://192.168.1.20:5173 (a LAN IP) to reach the dashboard from
    # another device on the network.
    extra-origins: ${CONTRACTGUARD_CORS_EXTRA_ORIGINS:}

---
# Headless CI gate (FR-026): analysis only, JSON report on stdout, exit code
# 0 = clean, 1 = analysis failed, 2 = gated changes found. Example:
#   java -jar contractguard-backend.jar --spring.profiles.active=cli \
#     --contractguard.cli.repository=customer-consumer \
#     --contractguard.cli.old-spec=customer-api-v1.yaml \
#     --contractguard.cli.new-spec=customer-api-v2.yaml \
#     --contractguard.cli.fail-on=breaking
spring:
  config:
    activate:
      on-profile: cli
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    # Ephemeral store: the gate's state has no value beyond the process, and
    # a memory database cannot collide with a running server's file lock.
    url: jdbc:h2:mem:contractguard-cli;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

logging:
  level:
    root: warn
    # Keep stdout clean for the JSON report; version-affinity warnings are noise here.
    org.flywaydb: error

---
# Server deployments: run with --spring.profiles.active=postgres and the
# CONTRACTGUARD_DB_* environment variables set.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${CONTRACTGUARD_DB_URL:jdbc:postgresql://localhost:5432/contractguard}
    username: ${CONTRACTGUARD_DB_USER:contractguard}
    password: ${CONTRACTGUARD_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
