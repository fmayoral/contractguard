openapi: 3.0.3
info:
  title: Customer API
  version: 2.0.0
  description: Customer master data API (new contract).
paths:
  /v2/customers/{id}:
    get:
      operationId: getCustomerById
      summary: Fetch a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
components:
  schemas:
    Customer:
      type: object
      required:
        - id
        - displayName
        - status
      properties:
        id:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - CLOSED
        preferredLanguage:
          type: string
