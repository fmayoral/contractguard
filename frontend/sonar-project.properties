# Analysed with the sonarsource/sonar-scanner-cli Docker image against the
# opt-in `sonarqube` compose service -- see docs/deployment.md §7. Never bound
# into any npm script, so a plain `npm test`/`npm run build` neither needs nor
# touches a SonarQube instance.
#
# sonar.host.url is deliberately NOT set here: "localhost" means something
# different from inside the scanner-cli container (itself) than from a
# natively-run scanner (the host) -- docs/deployment.md §7 passes it as
# SONAR_HOST_URL at invocation time instead of hardcoding either meaning.
sonar.projectKey=contractguard-frontend
sonar.projectName=ContractGuard Frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/main.tsx,src/test-setup.ts

# Produced by `npm run test:coverage` (frontend/vite.config.ts's vitest
# coverage.reporter includes 'lcov' for exactly this).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fails the scan itself if the (built-in "Sonar way") quality gate doesn't
# pass, so a regression is caught at analysis time, not just shown on a
# dashboard nobody checks.
sonar.qualitygate.wait=true
