server:
  # Local-first: bind to loopback only by default. 7080 rather than 8080
  # because desktop software (e.g. NVIDIA Broadcast) squats on 8080, and
  # Windows Hyper-V/WinNAT port-exclusion ranges often swallow 8081-9231.
  address: 127.0.0.1
  port: 7080

spring:
  application:
    name: contractguard
  datasource:
    url: jdbc:h2:file:./../data/contractguard;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    # Vendor-specific DDL: db/migration/h2 locally, db/migration/postgresql
    # when the postgres profile is active.
    locations: classpath:db/migration/{vendor}
    # Adopt databases created before Flyway managed the schema.
    baseline-on-migrate: true

contractguard:
  # Repositories must live directly under one of these roots.
  workspace:
    roots:
      - ../workspace
  storage:
    # Embedded database and run artifacts live here.
    directory: ../data
    # Days to keep finished runs (events and artifacts included); 0 disables.
    retention-days: 0
  specs:
    # Directory the run setup offers OpenAPI specifications from.
    directory: ../samples/openapi
  llm:
    # mock = deterministic scripted gateway (no network, no key).
    # openai = OpenAI-compatible endpoint configured below.
    provider: mock
    base-url: ${CONTRACTGUARD_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${CONTRACTGUARD_LLM_API_KEY:}
    model: ${CONTRACTGUARD_LLM_MODEL:gpt-4o-mini}
    timeout: 60s
    max-tokens: 4096
    temperature: 0.0
    max-workflow-steps: 20
  validation:
    command-key: maven-verify
    timeout: 15m
    max-output-bytes: 1000000

---
# Server deployments: run with --spring.profiles.active=postgres and the
# CONTRACTGUARD_DB_* environment variables set.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${CONTRACTGUARD_DB_URL:jdbc:postgresql://localhost:5432/contractguard}
    username: ${CONTRACTGUARD_DB_USER:contractguard}
    password: ${CONTRACTGUARD_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
